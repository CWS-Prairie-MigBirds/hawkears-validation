name: Update validation results

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC (~03:17 Edmonton)
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::purrr
            any::jsonlite
            github::ABbiodiversity/wildrtrax

      - name: Build results.json from WildTrax
        env:
          WT_USERNAME: ${{ secrets.WT_USERNAME }}
          WT_PASSWORD: ${{ secrets.WT_PASSWORD }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          SITE_LABEL: ${{ vars.SITE_LABEL }}
                run: Rscript hawkears-validation-site/R/build_results.R

      - name: Commit if results changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/results.json
          if git diff --cached --quiet; then
            echo "No change in results."
          else
            git commit -m "Update validation results"
            git push
          fi
